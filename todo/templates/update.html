<!DOCTYPE html>
<html>
    <head>
        <title>Update Task</title>
    </head>
    <body>
        <h1>Update Task</h1>

        <form method="POST">
            {% csrf_token %}

            <input
               type="text"
               name="title"
               value="{{ form.title.value|default_if_none:'' }}"
               required>
            {% for error in form.title.errors %}
                <p class="error-message">{{ error }}</p>
            {% endfor %}
        <br><br>

        <label>
            <input
               type="checkbox"
               name="completed"
               {% if form.completed.value %}checked{% endif %}>
               Completed
        </label>
        
        <br><br>

        <button type="submit">
            Save
        </button>
        </form>
        {% for error in form.non_field_errors %}
            <p class="error-message">{{ error }}</p>
        {% endfor %}

        <br>

        <a href="{% url 'home' %}">
            Back
        </a>
    </body>
</html>
