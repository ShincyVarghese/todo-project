<!DOCTYPE html>
<html>
    <head>
        <title>Update Task</title>
    </head>
    <body>
        <h1>Update Task</h1>

        <form method="POST">
            {% csrf_token %}

            <input
               type="text"
               name="title"
               value="{{task.title}}"
               required>
        <br><br>

        <label>
            <input
               type="checkbox"
               name="completed"
               {% if task.completed %}checked{% endif %}>
               Completed
        </label>
        
        <br><br>

        <button type="submit">
            Save
        </button>
        </form>

        <br>

        <a href="{% url 'home' %}">
            Back
        </a>
    </body>
</html>
